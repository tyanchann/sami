<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<meta name="color-scheme" content="dark">
<meta name="description" content="SAMINA — маленькая пиксельная история в восемь фрагментов.">
<title>SAMINA ♥</title>
<link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
<link rel="preload" href="./assets/fonts/Inter-cyrillic-400_700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/Inter-latin-400_700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/Manrope-cyrillic-600_800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- фон -->
  <div class="bg" aria-hidden="true">
    <span class="bg__glow"></span>
    <span class="bg__stars"></span>
    <span class="bg__grain"></span>
    <span class="bg__vignette"></span>
  </div>

  <!-- верхняя панель: звук, прогресс, жизни -->
  <header class="hud" id="hud" hidden>
    <div class="hud__left">
      <button class="iconbtn" id="btn-sound" type="button" aria-pressed="false" aria-label="Выключить звук">
        <svg viewBox="0 0 9 9" class="iconbtn__svg" aria-hidden="true" data-icon="sound"></svg>
      </button>
      <button class="iconbtn" id="btn-reset" type="button" aria-label="Начать заново">
        <svg viewBox="0 0 9 9" class="iconbtn__svg" aria-hidden="true" data-icon="reset"></svg>
      </button>
      <div class="progress" id="progress" title="Собрано фрагментов сердца">
        <span class="progress__heart" id="progress-heart"></span>
        <span class="progress__num"><b id="progress-count">0</b><i>/</i>8</span>
      </div>
    </div>
    <div class="hud__right">
      <div class="lives" id="lives" role="status" aria-label="Жизни"></div>
    </div>
  </header>

  <!-- активная сцена -->
  <main class="scene" id="scene"></main>

  <!-- слои эффектов -->
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="wipe" id="wipe" aria-hidden="true"></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <!-- модальное окно (сброс / повтор) -->
  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__text" id="modal-text"></p>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="modal-cancel" type="button">Отмена</button>
        <button class="btn btn--rose" id="modal-ok" type="button">Да</button>
      </div>
    </div>
  </div>

</div>

<noscript>
  <div class="noscript">Для этой маленькой истории нужен JavaScript ♥</div>
</noscript>

<script type="module" src="./js/main.js"></script>
</body>
</html>
